# ── TT-FOP Parser Service (Docker) ──
# Runs ONLY the Python parser microservice in Docker.
# The Next.js app runs locally via `npm run dev`.
#
# Usage:
#   docker compose up --build -d     (start parser in background)
#   docker compose logs -f           (view logs)
#   docker compose down              (stop)

services:
  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    container_name: tt-fop-parser
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    environment:
      - PORT=8000
